# Fortran CI — CMake project, includes Linux / macOS / Windows (MSYS2/MinGW)
on: [push, pull_request]

name: Fortran CI

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2 (Windows only)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >
            mingw-w64-x86_64-toolchain

      - name: Install build tools (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y gfortran build-essential cmake
          else
            brew update
            brew install gcc cmake
          fi

      - name: Build (CMake)
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f CMakeLists.txt ]; then
            echo "No CMakeLists.txt found — skipping build."
            exit 0
          fi

          echo "Detected CMake project."

          # Prefer unversioned gfortran if present
          FC=""
          if command -v gfortran >/dev/null 2>&1; then
            FC="$(command -v gfortran)"
          else
            # Check common locations and versioned names (expand globs explicitly)
            for p in /usr/bin/gfortran /usr/local/bin/gfortran /opt/homebrew/bin/gfortran \
                     /opt/homebrew/bin/gfortran-* /usr/local/bin/gfortran-* /usr/bin/gfortran-* \
                     /mingw64/bin/gfortran /usr/bin/x86_64-w64-mingw32-gfortran; do
              if [ -x "$p" ]; then
                FC="$p"
                break
              fi
            done
          fi

          if [ -z "$FC" ]; then
            echo "Error: No Fortran compiler found (gfortran)."
            if [ "${{ runner.os }}" = "Linux" ]; then
              echo "On Linux: add 'sudo apt-get install -y gfortran' to the workflow."
            elif [ "${{ runner.os }}" = "macOS" ]; then
              echo "On macOS: 'brew install gcc' should provide gfortran; this workflow already attempts that — check the 'Install build tools' step logs."
            else
              echo "On Windows: ensure MSYS2 MinGW toolchain is installed and in PATH."
            fi
            exit 1
          fi

          echo "Using Fortran compiler: $FC"
          "$FC" --version || true

          mkdir -p build
          cd build

          if [ "${{ runner.os }}" = "Windows" ]; then
            cmake -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_Fortran_COMPILER="$FC" ..
            cmake --build . -- -j$(nproc || echo 2)
          else
            cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_Fortran_COMPILER="$FC" ..
            cmake --build . --parallel
          fi

          # Run tests with ctest — failures will fail the job
          if command -v ctest >/dev/null 2>&1; then
            ctest --output-on-failure
          fi