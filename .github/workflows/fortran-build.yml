# Fortran CI — CMake project, Linux / macOS use gfortran, Windows uses fortran-lang/setup-fortran@v1 (prefer ifx)
on: [push, pull_request]

name: Fortran CI

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y gfortran build-essential cmake
          else
            brew update
            brew install gcc cmake
          fi

      - name: Setup Fortran (Windows)
        if: runner.os == 'Windows'
        uses: fortran-lang/setup-fortran@v1

      - name: Build on Windows (prefer ifx, fallback to gfortran)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path CMakeLists.txt)) {
            Write-Host "No CMakeLists.txt found — skipping build."
            exit 0
          }

          # Detect ifx first
          $ifx = Get-Command ifx -ErrorAction SilentlyContinue
          if ($ifx) {
            Write-Host "Using ifx at $($ifx.Path)"
            $fc = $ifx.Path
            # Use Visual Studio generator
            cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_Fortran_COMPILER="$fc" -DCMAKE_BUILD_TYPE=Release
            cmake --build build --config Release -- /m
            if (Get-Command ctest -ErrorAction SilentlyContinue) {
              ctest --test-dir build -C Release --output-on-failure
            }
            exit 0
          }

          # Fallback: try gfortran (should be provided by setup-fortran or MSYS2)
          $gfortran = Get-Command gfortran -ErrorAction SilentlyContinue
          if (-not $gfortran) {
            Write-Error "No ifx and no gfortran found on Windows. Ensure fortran-lang/setup-fortran provides compilers or use a self-hosted runner with ifx."
            exit 1
          }

          Write-Host "Using gfortran at $($gfortran.Path)"
          $fc = $gfortran.Path
          # Use MinGW/Makefile generator (assumes setup-fortran provided a MinGW toolchain or PATH)
          # Create build with MinGW Makefiles and build using MSYS2 bash
          bash -lc "set -euo pipefail
            mkdir -p build
            cd build
            cmake -G \"MinGW Makefiles\" -DCMAKE_BUILD_TYPE=Release -DCMAKE_Fortran_COMPILER='$fc' ..
            cmake --build . -- -j\$(nproc || echo 2)
            if command -v ctest >/dev/null 2>&1; then
              ctest --output-on-failure
            fi
          "

      - name: Build (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f CMakeLists.txt ]; then
            echo "No CMakeLists.txt found — skipping build."
            exit 0
          fi

          # Prefer unversioned gfortran, else check common paths
          FC=""
          if command -v gfortran >/dev/null 2>&1; then
            FC="$(command -v gfortran)"
          else
            for p in /usr/bin/gfortran /usr/local/bin/gfortran /opt/homebrew/bin/gfortran /opt/homebrew/bin/gfortran-*; do
              if [ -x "$p" ]; then
                FC="$p"
                break
              fi
            done
          fi

          if [ -z "$FC" ]; then
            echo "Error: No Fortran compiler found (gfortran)."
            exit 1
          fi

          echo "Using Fortran compiler: $FC"
          "$FC" --version || true

          mkdir -p build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_Fortran_COMPILER="$FC" ..
          cmake --build . --parallel
          if command -v ctest >/dev/null 2>&1; then
            ctest --output-on-failure
          fi