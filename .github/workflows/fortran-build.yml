# Fortran CI — use fortran-lang/setup-fortran@v1 to set FC/CC/CXX
# Linux / macOS: use the FC provided by the action
# Windows: require Intel ifx and run Intel setvars before CMake (debug + build)
on: [push, pull_request]

name: Fortran CI

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Fortran (install compilers & export FC/CC/CXX)
        if: runner.os == 'Windows'
        uses: fortran-lang/setup-fortran@v1.8.1
        with:
          compiler: intel
          version: '2025.0'

      - name: Setup Fortran (Linux / macOS install compilers & export FC/CC/CXX)
        if: runner.os != 'Windows'
        uses: fortran-lang/setup-fortran@v1.8.1

      - name: Ensure cmake present (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y cmake
          else
            brew update
            brew install cmake
          fi

      - name: Debug and Build (Windows with Intel ifx via setvars)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # tolerate non-zero status from probes so we can continue to meaningful debug info
          $ErrorActionPreference = 'Continue'

          # Typical setvars location on hosted runners; adjust if different or prefer a secret
          $setvars = 'C:\Program Files (x86)\Intel\oneAPI\setvars.bat'
          if (Test-Path $setvars) { Write-Host "Found setvars: $setvars" } else { Write-Host "setvars not found at $setvars" }

          Write-Host "FC from setup-fortran: '$Env:FC'"

          # Probe the compiler version in a tolerant way (ignore non-zero exits)
          try { & $Env:FC --version 2>&1 | Write-Host } catch { try { & $Env:FC -V 2>&1 | Write-Host } catch { try { & $Env:FC /version 2>&1 | Write-Host } catch { Write-Host "ifx version probe failed (non-fatal)" } } }

          if (-not (Test-Path $setvars)) {
            Write-Error "setvars.bat not found; oneAPI may not be installed on this runner. This job requires Intel oneAPI/ifx."
            exit 1
          }

          # Build by running setvars and CMake in the same cmd process so Intel environment is applied
          $cmd = "`"$setvars`" && cmake -S . -B build -G ""Visual Studio 17 2022"" -A x64 -DCMAKE_BUILD_TYPE=Release -DCMAKE_Fortran_COMPILER=""$Env:FC"" && cmake --build build --config Release -- /m"
          Write-Host "Running (cmd): $cmd"
          cmd /c $cmd

      - name: Build (Linux / macOS — use FC from setup-fortran)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f CMakeLists.txt ]; then
            echo "No CMakeLists.txt found — skipping build."
            exit 0
          fi

          if [ -z "${FC:-}" ]; then
            echo "FC is not set by setup-fortran. Aborting."
            exit 1
          fi

          echo "Using Fortran compiler from setup-fortran: ${FC}"
          "${FC}" --version || true

          mkdir -p build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_Fortran_COMPILER="${FC}" ..
          cmake --build . --parallel
          if command -v ctest >/dev/null 2>&1; then
            ctest --output-on-failure
          fi