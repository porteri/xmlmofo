# Fortran CI — use fortran-lang/setup-fortran@v1 to set compiler IDs (FC, CC, CXX, FPM_*)
# Linux / macOS: use the FC provided by the action (usually gfortran)
# Windows: require Intel ifx provided via setup-fortran (no gfortran fallback)
on: [push, pull_request]

name: Fortran CI

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Fortran (install compilers & export FC/CC/CXX)
        uses: fortran-lang/setup-fortran@v1

      - name: Ensure cmake present (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y cmake
          else
            brew update
            brew install cmake
          fi

      - name: Build (Windows — require ifx)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path CMakeLists.txt)) {
            Write-Host "No CMakeLists.txt found — skipping build."
            exit 0
          }

          # The setup-fortran action exports FC to GITHUB_ENV; read it from the environment.
          if (-not $Env:FC) {
            Write-Error "FC not set by setup-fortran; cannot determine Fortran compiler."
            exit 1
          }

          Write-Host "FC = $Env:FC"

          # Require Intel ifx compiler name/path
          if ($Env:FC -notmatch '(^|[\\\/])ifx($|[^\w])' -and $Env:FC -notmatch 'ifx.exe') {
            Write-Error "This Windows job requires Intel Fortran 'ifx' as FC. FC='$Env:FC'"
            Write-Host ""
            Write-Host "Options:"
            Write-Host " - Use a self-hosted Windows runner with Intel oneAPI/ifx installed."
            Write-Host " - Ensure setup-fortran@v1 supplies ifx to the hosted runner (may not be available)."
            exit 1
          }

          # Configure and build using Visual Studio generator and explicit Fortran compiler
          & cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release -DCMAKE_Fortran_COMPILER="$Env:FC"
          & cmake --build build --config Release -- /m

          if (Get-Command ctest -ErrorAction SilentlyContinue) {
            & ctest --test-dir build -C Release --output-on-failure
          }

      - name: Build (Linux / macOS — use FC from setup-fortran)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f CMakeLists.txt ]; then
            echo "No CMakeLists.txt found — skipping build."
            exit 0
          fi

          if [ -z "${FC:-}" ]; then
            echo "FC is not set by setup-fortran. Aborting."
            exit 1
          fi

          echo "Using Fortran compiler from setup-fortran: ${FC}"
          "${FC}" --version || true

          mkdir -p build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_Fortran_COMPILER="${FC}" ..
          cmake --build . --parallel
          if command -v ctest >/dev/null 2>&1; then
            ctest --output-on-failure
          fi